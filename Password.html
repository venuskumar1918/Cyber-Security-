<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title> Password Strength Checker </title>
<style>
body{
 font-family: Arial, sans-serif;
background: #101827;
color:white ;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
margin:0;}
.container{
background: #1e293b;
padding: 30px;
border-radius:15px;
width: 85%;
max-width: 400px;
text-align:center;}
h1{
color:#38bdf8;
font-size:25px;}
p{color:#cbd5e1;}
input{width:90%;
padding: 13px;
margin-top:15px;
border:none;
border-radius: 7px;
font-size:16px}

button{
padding:10px 18px;
margin-top:15px;
border:none;
border-radius:7px;
background:#0284c7;
color:white;
cursor: pointer;}

.bar{
height:10px;
background:#475569;
border-radius:10px;
margin-top: 20px;
overflow: hidden;}

#progress{
height:100%;
width:0%;
transition:0.3s;}
#result{
font-size:20px;
margin-top:15px;
font-weight:bold;}

#suggestions {
text-align: left;
line-height:1.8;
color:#cbd5e1;
}
.note{font-size:12px;}
</style>
</head>

<body>
<div class="container">
<h1>🔐Password Strength Checker </h1>

<input 
type="password"
id="password"
placeholder="Enter your password" 
oninput="checkPassword()">
<br>
<button onclick="togglePassword()">
Show/Hid Password
</button>
<div class="bar">
<div id="progress"></div></div>
<div id="result"> Enter your password </div>

<h3> Security Suggestions: </h3>

<ul id="suggestions">
<li> Use at least 8 characters.  </li>
<li> Include uppercase letters. </li>
<li> Include lowercase letters. </li>
<li> Include numbers. </li>
<li> Include symbols. </li>
</ul>
<p class="note"> </p>
</div>
<script>
function checkPassword(){
let password= document.getElementById("password"). value;
let score=0;
let suggestions=[];
if (password.length>=8){
score++;
}else{suggestions.push("Use at least 8 characters.");}
if(/[A-Z]/.test(password)){
score++;}
else{
suggestions.push("Add an uppercase letter.");
}
if(/[a-z]/.test(password)){score++;
}else{
suggestions.push("Add a lowercase letter.");}
if(/[0-9]/.test(password)){
score++;
}else{suggestions.push("Add a number.");}
if (/[^A-Za-z0-9]/.test(password)){
score++;}
else{
suggestions.push("Add a special character.");
}

let result=
document.getElementById("result");
let progress=
document.getElementById("progress");
let percentage=(score/5)*100;
progress.style.width=percentage+"%";
if(password.length===0) {
result.innerHTML="Enter your password";
progress.style.width= "0%";}
else if (score<=2){
result.innerHTML="Weak Password☹️";}
else if (score===3){
result.innerHTML="Medium Password😐";
}
else if(score===4){
result.innerHTML="Strong Password 😀";}
else{
result.innerHTML="Very Strong Password🥳";}

if(score<=2){progress.style.background="#ef4444";}
else if (score===3){
progress.style.background = "#eab308";}
else{
progress.style.background="#22c55e";}
if (password.length===0){
suggestions=[
"Use at least 8 characters.",
"Include uppercase and lowercase letters.",
"Include numbers and symbols."];
}
document.getElementById("suggestions").innerHTML=
suggestions.length
?suggestions.map(item=> "<li>"+item+"</li>").join("")
:"<li>All basic checks passed!</li>";}
function togglePassword(){
let input=
document.getElementById("password");

if(input.type==="password"){
input.type="text";}else{
input.type="password";}}

</script>

</body>
</html>
